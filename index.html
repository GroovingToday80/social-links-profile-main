<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png" />

    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      @font-face {
        font-family: 'Inter';
        src: url(./assets/fonts/Inter-VariableFont_slnt\,wght.ttf);
      }

      :root {
        --green: hsl(75, 94%, 57%);
        --white: hsl(0, 0%, 100%);
        --grey-700: hsl(0, 0%, 20%);
        --grey-800: hsl(0, 0%, 12%);
        --grey-900: hsl(0, 0%, 8%);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter';
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 0;
        min-height: 100vh;
        color: var(--white);
        background-color: var(--grey-900);
        text-align: center;
        font-size: 14px;
      }

      .card {
        background-color: var(--grey-800);
        padding: 48px;
        border-radius: 16px;
        width: 400px;
        margin: 16px;
      }

      .profile-picture {
        border-radius: 50%;
        width: 100px;
      }

      .card h2 {
        font-weight: 600;
        margin-bottom: 0;
        font-size: 28px;
      }

      .card h3 {
        font-weight: 600;
        color: var(--green);
        margin-top: 8px;
        margin-bottom: 24px;
      }

      .link-buttons {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .link-buttons a {
        background-color: var(--grey-700);
        border-radius: 8px;
        width: 100%;
        color: inherit;
        text-decoration: none;
        margin: 8px;
        padding: 16px;
        font-weight: bold;
        transition: 0.25s;
      }

      .link-buttons a:hover {
        background-color: var(--green);
        color: var(--grey-800);
      }

      /* attribution */
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        src="/assets/images/avatar-jessica.jpeg"
        alt="profile picture"
        class="profile-picture" />
      <h2>Jessica Randall</h2>
      <h3>London, United Kingdom</h3>
      <p>"Front-end developer and avid reader."</p>

      <div class="link-buttons">
        <a href="#">GitHub</a>
        <a href="#">Frontend Mentor</a>
        <a href="#">LinkedIn</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/GroovingToday80">GroovingToday80</a>.
    </footer>
  </body>
</html>
